[env:esp32p4_m5stack]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = esp32-p4-evboard
framework = arduino

upload_speed = 1500000
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
; Loest Backtraces/MEPC im Panic automatisch in Datei:Zeile auf (reiner Monitor-Filter, kein Build-Einfluss)
monitor_filters = esp32_exception_decoder

build_type = debug
build_unflags = -mlongcalls
lib_ldf_mode = deep

; ==============================================================================
; P-40: TCP-Empfangsfenster - der gemessene Engpass der Bildrate
; ==============================================================================
; Gemessen (performance.md 9.5): Warten auf die Kamera 0,3 ms, Empfang der
; Bytes 230 ms. Es ist ausschliesslich der Empfangspfad.
;
; Die Voreinstellung ist CONFIG_LWIP_TCP_WND_DEFAULT=5760, also vier Segmente
; zu 1436 Bytes. Der Durchsatz einer TCP-Verbindung ist durch
; Fenster / Umlaufzeit gedeckelt:
;
;     5760 B / 11 ms = 524 KB/s     <- unsere besten Messwerte
;     5760 B / 16 ms = 360 KB/s     <- unsere schlechten Messwerte
;
; Das erklaert das gesamte beobachtete Band von 296 bis 560 KB/s allein aus
; schwankender Funklaufzeit - und es erklaert, warum keine Aenderung am Code
; je etwas gebracht hat. Die Bremse liegt nicht im Programm.
;
; 28720 Bytes sind 20 Segmente und heben den Deckel auf rund 1,8 MB/s bei
; 16 ms. Weit mehr als die 791 KB/s, die dieselbe Kamera am PC liefert - der
; Engpass wandert damit dorthin, wo er hingehoert: ins Funknetz.
;
; RECVMBOX muss mitwachsen (Richtwert: mindestens Fenster / MSS = 20), sonst
; staut es an der Uebergabe zur Socket-Schicht.
;
; ACHTUNG: Diese Einstellung laesst die Bibliotheken aus der Quelle neu bauen.
; Der erste Build danach dauert sehr lange.
; ==============================================================================
; ------------------------------------------------------------------------------
; AUSGESCHALTET - Fehler in pioarduino, nicht in diesen Werten.
; ------------------------------------------------------------------------------
; Das Ersetzen der sdkconfig-Werte funktioniert (der Build meldet alle fuenf
; Zeilen korrekt). Danach bricht es ab:
;
;   FileNotFoundError: ...\platforms\espressif32\builder\build_lib
;
; In builder/frameworks/espidf.py steht der Verzeichnisname fest verdrahtet:
;
;   LIB_SOURCE = os.path.join(platforms_dir, "espressif32", "builder", "build_lib")
;
; Diese Plattform wird hier aber aus einer Git-URL installiert und liegt
; deshalb unter "espressif32@src-<hash>". Der Pfad existiert also nicht. Mit
; der Registry-Fassung (platform = pioarduino/espressif32@54.3.21) traete der
; Fehler nicht auf - aber die Quelle der Plattform wird hier nicht angefasst,
; die Versionsbindung hat ihren Grund.
;
; Zum Einschalten: einmalig den Ordner an die erwartete Stelle kopieren,
; danach die vier Zeilen unten wieder aktivieren.
;
;   xcopy /E /I "%USERPROFILE%\.platformio\platforms\espressif32@src-bda0d388096ba428b24789b8ba47af4f\builder\build_lib" ^
;                "%USERPROFILE%\.platformio\platforms\espressif32\builder\build_lib"
;
; Wirkung laut Messung: Empfangsdeckel von rund 360 KB/s auf etwa 1,8 MB/s.
; Begruendung in src/doc/performance.md, 9.7.
; ------------------------------------------------------------------------------
; custom_sdkconfig =
;     CONFIG_LWIP_TCP_WND_DEFAULT=28720
;     CONFIG_LWIP_TCP_SND_BUF_DEFAULT=28720
;     CONFIG_LWIP_TCP_RECVMBOX_SIZE=24
;     CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM=64

; Stellt vor jedem Build sicher, dass der Panel_DSI-Eingriff steht.
; .pio/libdeps wird von PlatformIO jederzeit neu befuellt - ohne dieses Skript
; waere der DMA2D-Haenger nach einem Paketupdate stillschweigend zurueck.
; Siehe src/doc/video_refactoring.md, 2.12 und 2.18.
extra_scripts = pre:tools/patch_m5gfx.py

board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv

build_flags = 
    -DBOARD_HAS_PSRAM
    ; Stufe 1 (nur Fehler) statt 3 (Info). Grund ist nicht Kosmetik:
    ; Serial IST hier der USB-CDC (ARDUINO_USB_CDC_ON_BOOT=1), und der
    ; CDC-Interrupt stuerzt ab, wenn die Verbindung waehrend einer Ausgabe
    ; getrennt wird (hw_cdc_isr_handler, Store access fault auf 0x500D2000).
    ; Je weniger geschrieben wird, desto kleiner das Zeitfenster dafuer.
    ; Ausserdem blockiert CDC den schreibenden Task bei vollem Puffer.
    ; Siehe src/doc/performance.md, P-02 und 9.6.
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    
    ; ==============================================================
    ; FIX: Unterdrückt die nervigen LVGL-8 GCC-14 Warnungen im Log
    -Wno-deprecated-enum-enum-conversion
    ; ==============================================================
    
    ; ==============================================================
    ; DMA2D-Kanal-Reset umleiten (siehe src/system/Dma2dGuard.c)
    ; Die HAL wartet unbegrenzt auf ein Bit, das auf Silizium v1.3 nie
    ; gesetzt wird - mit gesperrten Interrupts, also Watchdog-Neustart.
    ; --wrap leitet jede Referenz aus libesp_hw_support.a auf unsere
    ; Fassung mit begrenzter Wartezeit um.
    ; ==============================================================
    -Wl,--wrap=dma2d_hal_tx_reset_channel
    -Wl,--wrap=dma2d_hal_rx_reset_channel

    -I src
    -I src/config
    -I src/gui/core
    -I src/gui/baby
    -I src/gui/cat
    -I src/gui/ha
    -I src/gui/ha/HaDialogs
    -I src/gui/ha/HaDialogs/HaDialogEdit
    -I src/gui/ha/HaWidgets
    -I src/gui/fonts
    -I src/ha
    -I src/media
    -I src/system


lib_deps = 
    lvgl/lvgl@8.3.11
    knolleary/PubSubClient@^2.8
    m5stack/M5GFX@0.2.19
    tobozo/LGFX_PPA@^0.2.2
    m5stack/M5Unified@0.2.13
    https://github.com/earlephilhower/ESP8266Audio.git
    bblanchon/ArduinoJson@^7.0.4
    gilmaimon/ArduinoWebsockets@^0.5.4
    ; NEU: Der offizielle CDC-ACM Wrapper für ESP-Hosts (Perfekt für den Dongle)
    https://github.com/bertmelis/USBHostSerial.git
    